version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: tuesday
      time: "10:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    groups:
      next-react-compatible:
        applies-to: version-updates
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
        update-types:
          - minor
          - patch
      frontend-testing-compatible:
        applies-to: version-updates
        patterns:
          - "@testing-library/*"
          - jsdom
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    groups:
      web-push-compatible:
        applies-to: version-updates
        patterns:
          - aiohttp
          - aiohappyeyeballs
          - aiosignal
          - attrs
          - charset-normalizer
          - frozenlist
          - http-ece
          - py-vapid
          - pywebpush
          - requests
          - urllib3
          - yarl
        update-types:
          - minor
          - patch
      face-runtime-compatible:
        applies-to: version-updates
        patterns:
          - numpy
          - opencv-python-headless
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: thursday
      time: "10:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: friday
      time: "10:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
