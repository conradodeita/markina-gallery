name: Release 0090 autorizado com CI existente

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operação de release 0090
        type: choice
        required: true
        options:
          - preview-adjustment-migration-wrapper-install
          - preview-adjustment-migration-preflight
          - preview-adjustment-migration-release
      authorization_confirmed:
        description: Confirma autorização vigente do proprietário para o escopo e ambiente
        type: boolean
        required: true
        default: false

permissions: {}

jobs:
  ci-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Conferir contrato do fluxo protegido
        run: python -m unittest scripts.test_fast_preview_release -q
      - name: Conferir CI de push da main para o SHA de suporte
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_main_ci_evidence.py --sha "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  preview-adjustment-migration-scope:
    if: "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'preview-adjustment-migration-wrapper-install' || inputs.operation == 'preview-adjustment-migration-preflight' || inputs.operation == 'preview-adjustment-migration-release') }}"
    needs: [ci-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validar candidato 0089 para 0090 e CI verde
        run: python scripts/check_preview_adjustment_migration_scope.py --base c1944189761799be96eeeb921cad9906484d8b09 --target 0dd015a62447e0c8d4c6af16b381140c8118f2ec --ci-conclusion success | tee -a "$GITHUB_STEP_SUMMARY"

  preview-adjustment-migration-wrapper-install:
    if: "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'preview-adjustment-migration-wrapper-install' && inputs.authorization_confirmed == true }}"
    needs: [ci-evidence, preview-adjustment-migration-scope]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Instalar somente o wrapper read-only aprovado
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_KNOWN_HOSTS; do
            [[ -n "${!required}" ]] || { echo "Configuração protegida ausente: $required" >&2; exit 1; }
          done
          key_file="$(mktemp)"; known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          wrapper_blob="$(git rev-parse "$GITHUB_SHA:scripts/production-preflight-ssh-wrapper.sh")"
          [[ "$wrapper_blob" =~ ^[0-9a-f]{40}$ ]]
          remote_command="cd /opt/markina-gallery && MARKINA_EXPECTED_REPOSITORY='$GITHUB_REPOSITORY' bash -s -- --mode install --support-sha '$GITHUB_SHA' --wrapper-blob '$wrapper_blob'"
          ssh -i "$key_file" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" "$remote_command" < scripts/install-prod-preview-migration-wrapper.sh

  preview-adjustment-migration-preflight:
    if: "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'preview-adjustment-migration-preflight' || inputs.operation == 'preview-adjustment-migration-release') }}"
    needs: [ci-evidence, preview-adjustment-migration-scope]
    runs-on: ubuntu-latest
    environment: production-preflight
    permissions:
      contents: read
    outputs:
      approval_fingerprint: ${{ steps.inventory.outputs.approval_fingerprint }}
      inventory_json: ${{ steps.inventory.outputs.inventory_json }}
    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_PREFLIGHT_SSH_HOST }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_PREFLIGHT_SSH_PORT }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_PREFLIGHT_SSH_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_PREFLIGHT_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_PREFLIGHT_SSH_KNOWN_HOSTS }}
      PRODUCTION_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PREFLIGHT_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verificar configuração protegida de inventário
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_KNOWN_HOSTS PRODUCTION_PUBLIC_BASE_URL; do
            [[ -n "${!required}" ]] || { echo "Configuração protegida ausente: $required" >&2; exit 1; }
          done
          [[ "$PRODUCTION_PUBLIC_BASE_URL" == "https://markina.pickyourpic.com.br" ]]
          [[ "$PRODUCTION_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
      - name: Obter inventário minimizado somente-leitura
        id: inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"; known_hosts_file="$(mktemp)"; output_file="$(mktemp)"; validated_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file" "$output_file" "$validated_file"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh -i "$key_file" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" "MARKINA_PREVIEW_MIGRATION_SUPPORT_SHA=$GITHUB_SHA" </dev/null | tee "$output_file"
          python - "$output_file" "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          lines = open(sys.argv[1], encoding='utf-8').read().splitlines()
          inventory = next((line.split('=', 1)[1] for line in lines if line.startswith('inventario_sanitizado=')), None)
          fingerprint = next((line.split('=', 1)[1] for line in lines if line.startswith('approval_fingerprint=')), None)
          if not inventory or not re.fullmatch(r'[0-9a-f]{64}', fingerprint or ''):
              raise SystemExit('Inventário ou fingerprint inválido')
          parsed = json.loads(inventory)
          with open(sys.argv[2], 'a', encoding='utf-8') as out:
              out.write(f'approval_fingerprint={fingerprint}\n')
              out.write('inventory_json<<INVENTORY\n' + json.dumps(parsed, sort_keys=True, separators=(',', ':')) + '\nINVENTORY\n')
          PY
          cat "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  preview-adjustment-migration-release:
    if: "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'preview-adjustment-migration-release' && inputs.authorization_confirmed == true && needs.preview-adjustment-migration-preflight.result == 'success' }}"
    needs: [ci-evidence, preview-adjustment-migration-scope, preview-adjustment-migration-preflight]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Executar migration somente com fingerprint recém-aprovado
        shell: bash
        env:
          APPROVAL_FINGERPRINT: ${{ needs.preview-adjustment-migration-preflight.outputs.approval_fingerprint }}
        run: |
          set -Eeuo pipefail
          for required in PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_KNOWN_HOSTS PRODUCTION_PUBLIC_BASE_URL APPROVAL_FINGERPRINT; do
            [[ -n "${!required}" ]] || { echo "Configuração protegida ausente: $required" >&2; exit 1; }
          done
          key_file="$(mktemp)"; known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          remote_command="cd /opt/markina-gallery && MARKINA_EXPECTED_REPOSITORY='$GITHUB_REPOSITORY' MARKINA_PUBLIC_BASE_URL='$PRODUCTION_PUBLIC_BASE_URL' bash -s -- --mode release --support-sha '$GITHUB_SHA' --approval-fingerprint '$APPROVAL_FINGERPRINT'"
          ssh -i "$key_file" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" "$remote_command" < scripts/deploy-prod-preview-adjustment-migration.sh
