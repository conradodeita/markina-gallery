name: Instalar ponte API e web em produção

on:
  workflow_dispatch:

permissions: {}

jobs:
  ci-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Conferir CI de push da main para o SHA exato
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/verify_main_ci_evidence.py --sha "$GITHUB_SHA" --app-bridge-install | tee -a "$GITHUB_STEP_SUMMARY"

  production-app-compose-bridge-install:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [ci-evidence]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Revalidar CI do SHA antes da instalação
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/verify_main_ci_evidence.py --sha "$GITHUB_SHA" --app-bridge-install | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Instalar ponte root-only e wrapper de inventário revisados
        shell: bash
        env:
          PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          for required in PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_KNOWN_HOSTS; do
            [[ -n "${!required}" ]] || { echo "Configuração protegida ausente: $required" >&2; exit 1; }
          done
          key_file="$(mktemp)"; known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          bridge_blob="$(git rev-parse "$GITHUB_SHA:scripts/production_app_compose_bridge.py")"
          wrapper_blob="$(git rev-parse "$GITHUB_SHA:scripts/production-preflight-ssh-wrapper.sh")"
          [[ "$bridge_blob" =~ ^[0-9a-f]{40}$ && "$wrapper_blob" =~ ^[0-9a-f]{40}$ ]]
          ssh_options=(-i "$key_file" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file")
          target="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
          ssh "${ssh_options[@]}" "$target" \
            "cd /opt/markina-gallery && MARKINA_EXPECTED_REPOSITORY='$GITHUB_REPOSITORY' bash -s -- --support-sha '$GITHUB_SHA' --bridge-blob '$bridge_blob'" \
            < scripts/install-prod-app-compose-bridge.sh | tee -a "$GITHUB_STEP_SUMMARY"
          ssh "${ssh_options[@]}" "$target" \
            "cd /opt/markina-gallery && MARKINA_EXPECTED_REPOSITORY='$GITHUB_REPOSITORY' bash -s -- --mode install --support-sha '$GITHUB_SHA' --wrapper-blob '$wrapper_blob'" \
            < scripts/install-prod-preview-migration-wrapper.sh | tee -a "$GITHUB_STEP_SUMMARY"
