name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt -r backend/face-requirements.txt
      - name: Lint (ruff)
        run: ruff check backend/app backend/tests
      - name: Testes (pytest)
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
        working-directory: frontend
      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend
      - name: Testes (vitest)
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar mudanças e specs
        run: |
          set +e
          npx -y @fission-ai/openspec@latest validate --strict --all
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Diagnóstico detalhado do OpenSpec"
            npx -y @fission-ai/openspec@latest validate unify-gallery-presentation --type change --strict --no-interactive --json || true
            echo "::endgroup::"
            exit "$status"
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp gitleaks
      - name: Executar varredura de segredos (histórico completo)
        run: /tmp/gitleaks git -v

  deploy-homolog:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && !contains(github.event.head_commit.message, 'Homolog-Facial: reconcile-private') && !contains(github.event.head_commit.message, 'Homolog-Facial: resume-private') && !contains(github.event.head_commit.message, 'Homolog-Facial: retry-failed-private') }}"
    needs: [backend, frontend, openspec, gitleaks]
    runs-on: ubuntu-latest
    environment: homolog
    permissions:
      contents: read
    env:
      HOMOLOG_SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
      HOMOLOG_SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
      HOMOLOG_SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
      HOMOLOG_SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
      HOMOLOG_SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
      HOMOLOG_PUBLIC_BASE_URL: ${{ secrets.HOMOLOG_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar automação de entrega
        run: bash scripts/test_deploy_homolog.sh
      - name: Publicar SHA aprovado em homologação
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in HOMOLOG_SSH_HOST HOMOLOG_SSH_PORT HOMOLOG_SSH_USER HOMOLOG_SSH_PRIVATE_KEY HOMOLOG_SSH_KNOWN_HOSTS HOMOLOG_PUBLIC_BASE_URL; do
            if [[ -z "${!required}" ]]; then
              echo "Secret obrigatório ausente: $required" >&2
              exit 1
            fi
          done
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$HOMOLOG_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$HOMOLOG_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          if git log -1 --pretty=%B | grep -Fxq 'Homolog-Facial: pause-legacy-for-private-upgrade'; then
            pause_command="$(printf 'cd /opt/markina-gallery && env MARKINA_EXPECTED_REPOSITORY=%q bash -s -- --mode pause-legacy-for-private-upgrade --confirmation %q' "$GITHUB_REPOSITORY" 'PAUSE_LEGACY_FACIAL_FOR_PRIVATE_UPGRADE')"
            ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST" "$pause_command" < scripts/manage-homolog-facial.sh
          fi
          if git log -1 --pretty=%B | grep -Fxq 'Homolog-Facial: pause-private-for-upgrade'; then
            pause_command="$(printf 'cd /opt/markina-gallery && env MARKINA_EXPECTED_REPOSITORY=%q bash -s -- --mode pause-private --confirmation %q' "$GITHUB_REPOSITORY" 'PAUSE_AUTHORIZED_PRIVATE_FACIAL_FOR_DEPLOY')"
            ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST" "$pause_command" < scripts/manage-homolog-facial.sh
          fi
          remote_command="$(printf 'cd /opt/markina-gallery && env MARKINA_EXPECTED_REPOSITORY=%q MARKINA_PUBLIC_BASE_URL=%q bash -s -- --sha %q' "$GITHUB_REPOSITORY" "$HOMOLOG_PUBLIC_BASE_URL" "$GITHUB_SHA")"
          ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST" "$remote_command" < scripts/deploy-homolog.sh
          maintenance_mode="inventory"
          maintenance_confirmation=""
          if git log -1 --pretty=%B | grep -Fxq 'Homolog-Cleanup: galleries-and-clients'; then
            maintenance_mode="execute"
            maintenance_confirmation="DELETE_HOMOLOG_GALLERIES_AND_CLIENTS"
          fi
          maintenance_command="$(printf 'cd /opt/markina-gallery && bash -s -- --mode %q --confirmation %q' "$maintenance_mode" "$maintenance_confirmation")"
          ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST" "$maintenance_command" < scripts/maintain-homolog-data.sh

  reconcile-facial-homolog:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && contains(github.event.head_commit.message, 'Homolog-Facial: reconcile-private') }}"
    needs: [backend, frontend, openspec, gitleaks]
    runs-on: ubuntu-latest
    environment: homolog
    permissions:
      contents: read
    env:
      HOMOLOG_SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
      HOMOLOG_SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
      HOMOLOG_SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
      HOMOLOG_SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
      HOMOLOG_SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar reconciliação do lote ativo
        run: |
          bash scripts/test_manage_homolog_facial.sh
          python scripts/test_manage_homolog_facial_policy.py
      - name: Enfileirar somente fotos autorizadas já prontas
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in HOMOLOG_SSH_HOST HOMOLOG_SSH_PORT HOMOLOG_SSH_USER HOMOLOG_SSH_PRIVATE_KEY HOMOLOG_SSH_KNOWN_HOSTS; do
            [[ -n "${!required}" ]] || { echo "Secret obrigatório ausente: $required" >&2; exit 1; }
          done
          commit_message="$(git log -1 --pretty=%B)"
          grep -Fxq 'Homolog-Facial: reconcile-private' <<<"$commit_message" || { echo "trailer exato de reconciliação ausente" >&2; exit 1; }
          read_trailer() {
            local key="$1"
            local -a values
            mapfile -t values < <(git interpret-trailers --parse <<<"$commit_message" | sed -n "s/^${key}: //p")
            [[ "${#values[@]}" -eq 1 ]] || { echo "trailer $key deve aparecer exatamente uma vez" >&2; exit 1; }
            printf '%s' "${values[0]}"
          }
          deployed_sha="$(read_trailer Facial-Deployed-SHA)"
          batch_id="$(read_trailer Facial-Batch)"
          authorization_ref="$(read_trailer Facial-Authorization)"
          expected_count="$(read_trailer Facial-Expected-Count)"
          recorded_count="$(read_trailer Facial-Recorded-Count)"
          contains_minors="$(read_trailer Facial-Contains-Minors)"
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA publicado inválido" >&2; exit 1; }
          [[ "$batch_id" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] || { echo "batch_id inválido" >&2; exit 1; }
          [[ "$authorization_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] || { echo "authorization_ref inválido" >&2; exit 1; }
          [[ "$expected_count" =~ ^[0-9]+$ ]] && (( expected_count >= 500 && expected_count <= 1000 )) || { echo "expected_count inválido" >&2; exit 1; }
          [[ "$recorded_count" =~ ^[0-9]+$ ]] && (( recorded_count >= 500 && recorded_count <= 1000 )) || { echo "recorded_count inválido" >&2; exit 1; }
          [[ "$contains_minors" == "true" || "$contains_minors" == "false" ]] || { echo "contains_minors inválido" >&2; exit 1; }

          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$HOMOLOG_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$HOMOLOG_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          remote_command="$(printf 'cd /opt/markina-gallery && env MARKINA_EXPECTED_REPOSITORY=%q bash -s -- --mode reconcile-private --sha %q --batch-id %q --authorization-ref %q --expected-count %q --recorded-count %q --contains-minors %q --confirmation %q' "$GITHUB_REPOSITORY" "$deployed_sha" "$batch_id" "$authorization_ref" "$expected_count" "$recorded_count" "$contains_minors" 'RECONCILE_AUTHORIZED_PRIVATE_FACIAL_HOMOLOG')"
          ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST" "$remote_command" < scripts/manage-homolog-facial.sh

  resume-facial-homolog:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && contains(github.event.head_commit.message, 'Homolog-Facial: resume-private') }}"
    needs: [backend, frontend, openspec, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: homolog
    permissions:
      contents: read
    env:
      HOMOLOG_SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
      HOMOLOG_SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
      HOMOLOG_SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
      HOMOLOG_SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
      HOMOLOG_SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar retomada limitada do lote expirado
        run: |
          bash scripts/test_manage_homolog_facial.sh
          python scripts/test_manage_homolog_facial_policy.py
          python scripts/test_benchmark_homolog_facial_policy.py
      - name: Retomar fila autorizada e medir conclusão
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in HOMOLOG_SSH_HOST HOMOLOG_SSH_PORT HOMOLOG_SSH_USER HOMOLOG_SSH_PRIVATE_KEY HOMOLOG_SSH_KNOWN_HOSTS; do
            [[ -n "${!required}" ]] || { echo "Secret obrigatório ausente: $required" >&2; exit 1; }
          done
          commit_message="$(git log -1 --pretty=%B)"
          grep -Fxq 'Homolog-Facial: resume-private' <<<"$commit_message" || { echo "trailer exato de retomada ausente" >&2; exit 1; }
          read_trailer() {
            local key="$1"
            local -a values
            mapfile -t values < <(git interpret-trailers --parse <<<"$commit_message" | sed -n "s/^${key}: //p")
            [[ "${#values[@]}" -eq 1 ]] || { echo "trailer $key deve aparecer exatamente uma vez" >&2; exit 1; }
            printf '%s' "${values[0]}"
          }
          deployed_sha="$(read_trailer Facial-Deployed-SHA)"
          batch_id="$(read_trailer Facial-Batch)"
          authorization_ref="$(read_trailer Facial-Authorization)"
          expected_count="$(read_trailer Facial-Expected-Count)"
          window_minutes="$(read_trailer Facial-Window-Minutes)"
          contains_minors="$(read_trailer Facial-Contains-Minors)"
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA publicado inválido" >&2; exit 1; }
          [[ "$batch_id" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] || { echo "batch_id inválido" >&2; exit 1; }
          [[ "$authorization_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] || { echo "authorization_ref inválido" >&2; exit 1; }
          [[ "$expected_count" =~ ^[0-9]+$ ]] && (( expected_count >= 500 && expected_count <= 1000 )) || { echo "expected_count inválido" >&2; exit 1; }
          [[ "$window_minutes" =~ ^[0-9]+$ ]] && (( window_minutes >= 30 && window_minutes <= 240 )) || { echo "window_minutes inválido" >&2; exit 1; }
          [[ "$contains_minors" == "true" || "$contains_minors" == "false" ]] || { echo "contains_minors inválido" >&2; exit 1; }

          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$HOMOLOG_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$HOMOLOG_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh_base=(ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST")
          resume_command="$(printf 'cd /opt/markina-gallery && env MARKINA_EXPECTED_REPOSITORY=%q bash -s -- --mode resume-private --sha %q --batch-id %q --authorization-ref %q --expected-count %q --window-minutes %q --contains-minors %q --confirmation %q' "$GITHUB_REPOSITORY" "$deployed_sha" "$batch_id" "$authorization_ref" "$expected_count" "$window_minutes" "$contains_minors" 'RESUME_AUTHORIZED_PRIVATE_FACIAL_HOMOLOG')"
          "${ssh_base[@]}" "$resume_command" < scripts/manage-homolog-facial.sh
          benchmark_command="$(printf 'cd /opt/markina-gallery && python3 - --mode monitor --sha %q --duration %q --interval 5 --settle-samples 6 --batch-id %q --authorization-ref %q --expected-count %q --contains-minors %q --scope-from-manifest --confirmation %q' "$deployed_sha" "$((window_minutes * 60))" "$batch_id" "$authorization_ref" "$expected_count" "$contains_minors" 'BENCHMARK_AUTHORIZED_PRIVATE_FACIAL_HOMOLOG')"
          "${ssh_base[@]}" "$benchmark_command" < scripts/benchmark-homolog-facial.py | tee facial-benchmark.jsonl
      - name: Preservar somente métricas agregadas da retomada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facial-benchmark-resume-${{ github.sha }}
          path: facial-benchmark.jsonl
          if-no-files-found: warn
          retention-days: 7

  retry-failed-facial-homolog:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && contains(github.event.head_commit.message, 'Homolog-Facial: retry-failed-private') }}"
    needs: [backend, frontend, openspec, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: homolog
    permissions:
      contents: read
    env:
      HOMOLOG_SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
      HOMOLOG_SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
      HOMOLOG_SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
      HOMOLOG_SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
      HOMOLOG_SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar retentativa limitada do lote ativo
        run: |
          bash scripts/test_manage_homolog_facial.sh
          python scripts/test_manage_homolog_facial_policy.py
          python scripts/test_benchmark_homolog_facial_policy.py
      - name: Retentar somente falhas técnicas e medir conclusão
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in HOMOLOG_SSH_HOST HOMOLOG_SSH_PORT HOMOLOG_SSH_USER HOMOLOG_SSH_PRIVATE_KEY HOMOLOG_SSH_KNOWN_HOSTS; do
            [[ -n "${!required}" ]] || { echo "Secret obrigatório ausente: $required" >&2; exit 1; }
          done
          commit_message="$(git log -1 --pretty=%B)"
          grep -Fxq 'Homolog-Facial: retry-failed-private' <<<"$commit_message" || { echo "trailer exato de retentativa ausente" >&2; exit 1; }
          read_trailer() {
            local key="$1"
            local -a values
            mapfile -t values < <(git interpret-trailers --parse <<<"$commit_message" | sed -n "s/^${key}: //p")
            [[ "${#values[@]}" -eq 1 ]] || { echo "trailer $key deve aparecer exatamente uma vez" >&2; exit 1; }
            printf '%s' "${values[0]}"
          }
          deployed_sha="$(read_trailer Facial-Deployed-SHA)"
          batch_id="$(read_trailer Facial-Batch)"
          authorization_ref="$(read_trailer Facial-Authorization)"
          expected_count="$(read_trailer Facial-Expected-Count)"
          contains_minors="$(read_trailer Facial-Contains-Minors)"
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA publicado inválido" >&2; exit 1; }
          [[ "$batch_id" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] || { echo "batch_id inválido" >&2; exit 1; }
          [[ "$authorization_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] || { echo "authorization_ref inválido" >&2; exit 1; }
          [[ "$expected_count" =~ ^[0-9]+$ ]] && (( expected_count >= 500 && expected_count <= 1000 )) || { echo "expected_count inválido" >&2; exit 1; }
          [[ "$contains_minors" == "true" || "$contains_minors" == "false" ]] || { echo "contains_minors inválido" >&2; exit 1; }

          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$HOMOLOG_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$HOMOLOG_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh_base=(ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST")
          retry_command="$(printf 'cd /opt/markina-gallery && env MARKINA_EXPECTED_REPOSITORY=%q bash -s -- --mode retry-failed-private --sha %q --batch-id %q --authorization-ref %q --expected-count %q --contains-minors %q --confirmation %q' "$GITHUB_REPOSITORY" "$deployed_sha" "$batch_id" "$authorization_ref" "$expected_count" "$contains_minors" 'RETRY_FAILED_AUTHORIZED_PRIVATE_FACIAL_HOMOLOG')"
          "${ssh_base[@]}" "$retry_command" < scripts/manage-homolog-facial.sh
          benchmark_command="$(printf 'cd /opt/markina-gallery && python3 - --mode monitor --sha %q --duration 1800 --interval 5 --settle-samples 6 --batch-id %q --authorization-ref %q --expected-count %q --contains-minors %q --scope-from-manifest --confirmation %q' "$deployed_sha" "$batch_id" "$authorization_ref" "$expected_count" "$contains_minors" 'BENCHMARK_AUTHORIZED_PRIVATE_FACIAL_HOMOLOG')"
          "${ssh_base[@]}" "$benchmark_command" < scripts/benchmark-homolog-facial.py | tee facial-benchmark.jsonl
      - name: Preservar somente métricas agregadas da retentativa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facial-benchmark-retry-${{ github.sha }}
          path: facial-benchmark.jsonl
          if-no-files-found: warn
          retention-days: 7
