            echo 'A mudança inclui migration fora do escopo aprovado' >&2
            exit 1
          fi
      - name: Inventário remoto somente leitura
        id: inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          output_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file" "$output_file"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh -i "$key_file" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "MARKINA_TARGET_SHA=$GITHUB_SHA" </dev/null | tee "$output_file" | tee -a "$GITHUB_STEP_SUMMARY"
          fingerprint="$(sed -nE 's/^approval_fingerprint=([0-9a-f]{64})$/\1/p' "$output_file" | tail -n1)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || { echo 'Inventário não forneceu fingerprint válido' >&2; exit 1; }
          echo "approval_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Avaliar manutenção autorizada sem primeira ativação
        id: gates
        run: python scripts/check_prod_facial_release_gates.py --maintenance | tee -a "$GITHUB_STEP_SUMMARY"

  production-release:
