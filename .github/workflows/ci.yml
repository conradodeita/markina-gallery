          done
          [[ "$PRODUCTION_PUBLIC_BASE_URL" == "https://markina.pickyourpic.com.br" ]] || { echo 'Domínio diverge do alvo' >&2; exit 1; }
          [[ "$APPROVAL_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || { echo 'Fingerprint inválido' >&2; exit 1; }
          key_file="$(mktemp)"
