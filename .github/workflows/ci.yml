      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_PREFLIGHT_SSH_KNOWN_HOSTS }}
      PRODUCTION_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PREFLIGHT_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verificar configuração protegida de inventário
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_KNOWN_HOSTS PRODUCTION_PUBLIC_BASE_URL; do
            [[ -n "${!required}" ]] || { echo "Configuração protegida ausente: $required" >&2; exit 1; }
          done
          [[ "$PRODUCTION_PUBLIC_BASE_URL" == "https://markina.pickyourpic.com.br" ]] || { echo 'Domínio diverge do alvo' >&2; exit 1; }
          [[ "$PRODUCTION_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Porta SSH inválida' >&2; exit 1; }
      - name: Obter inventário minimizado somente-leitura
        id: inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          output_file="$(mktemp)"
          inventory_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file" "$output_file" "$inventory_file"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh -i "$key_file" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "MARKINA_RETIREMENT_TARGET_SHA=$GITHUB_SHA" </dev/null | tee "$output_file"
          sed -n 's/^retirement_inventory_json=//p' "$output_file" | tail -n1 > "$inventory_file"
          [[ -s "$inventory_file" ]] || { echo 'Inventário remoto não forneceu JSON' >&2; exit 1; }
          python scripts/retirement_inventory_policy.py < "$inventory_file" | tee -a "$GITHUB_STEP_SUMMARY" > "$output_file.validated"
          fingerprint="$(sed -nE 's/^approval_fingerprint=([0-9a-f]{64})$/\1/p' "$output_file.validated" | tail -n1)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || { echo 'Fingerprint de inventário inválido' >&2; exit 1; }
          inventory_json="$(sed -n 's/^inventario_sanitizado=//p' "$output_file.validated" | tail -n1)"
          echo "approval_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "inventory_json=$inventory_json" >> "$GITHUB_OUTPUT"

