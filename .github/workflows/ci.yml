name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      operation:
        description: Operação manual protegida em produção
        type: choice
        required: true
        default: none
        options:
          - none
          - app-release
          - app-rollback
          - infinitepay-retirement-preflight
          - infinitepay-retirement-release
          - preview-adjustment-migration-wrapper-install
          - preview-adjustment-migration-preflight
          - preview-adjustment-migration-release
          - orders-pilot-inventory
      approval_fingerprint:
        description: Fingerprint do inventário aprovado (obrigatório para release protegido)
        type: string
        required: false
        default: ''

jobs:
  ci-scope:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      backend_image: ${{ steps.classify.outputs.backend_image }}
      frontend_image: ${{ steps.classify.outputs.frontend_image }}
      preview: ${{ steps.classify.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Testar classificação de escopo e gate agregado
        run: python -m unittest scripts.test_classify_ci_scope scripts.test_check_ci_results -q
      - name: Classificar validações necessárias
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA...$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths.txt"
            python scripts/classify_ci_scope.py --output "$GITHUB_OUTPUT" < "$RUNNER_TEMP/changed-paths.txt"
          else
            python scripts/classify_ci_scope.py --full --output "$GITHUB_OUTPUT"
          fi

  backend-quality:
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/face-requirements.txt
            backend/benchmark-requirements.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt -r backend/face-requirements.txt -r backend/benchmark-requirements.txt
      - name: Lint (ruff)
        run: ruff check backend/app backend/tests
      - name: Persistência de branding e política de deploy
        run: |
          python scripts/test_preserve_branding.py -v
          python -m unittest scripts.test_third_party_report -v
          python -m unittest scripts.test_python_security_release -v
          python scripts/test_specialized_pillow_pin.py -v
          python scripts/test_specialized_pillow_candidate.py -v
          python scripts/test_specialized_pillow_release.py -v
          PYTHONPATH=scripts python -m unittest scripts.test_infinitepay_retirement_scope -v
          PYTHONPATH=scripts python -m unittest scripts.test_retirement_inventory_policy -v
          PYTHONPATH=scripts python -m unittest scripts.test_retirement_host_references -v
          PYTHONPATH=scripts python -m unittest scripts.test_retirement_financial_evidence -v
          PYTHONPATH=scripts python -m unittest scripts.test_retirement_binding_removal -v
          PYTHONPATH=scripts python -m unittest scripts.test_retirement_pix_evidence -v
          PYTHONPATH=scripts python -m unittest scripts.test_preview_adjustment_migration_scope -v
          PYTHONPATH=scripts python -m unittest scripts.test_preview_adjustment_migration_inventory -v
          PYTHONPATH=scripts python -m unittest scripts.test_preview_adjustment_migration_release_flow -v
          PYTHONPATH=scripts python -m unittest scripts.test_preview_adjustment_migration_release -v
          bash scripts/test_deploy_homolog.sh
          bash scripts/test_deploy_prod_web.sh
          bash -n scripts/deploy-prod-infinitepay-retirement.sh
          bash scripts/test_deploy_prod_infinitepay_retirement.sh
          bash -n scripts/deploy-prod-facial-services.sh
          bash scripts/test_reset_homolog_owner.sh
          python scripts/test_owner_reset_policy.py
          python scripts/check_prod_facial_release_gates.py
          ruff check scripts/reset_homolog_owner.py
      - name: Provar SIGINT gracioso para Python como PID 1 ocioso
        shell: bash
        run: |
          set -Eeuo pipefail
          image='docker.io/library/python:3.8.20-slim-bookworm@sha256:1d52838af602b4b5a831beb13a0e4d073280665ea7be7f69ce2382f29c5a613f'
          name="markina-pid1-sigint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker pull "$image"
          docker run --detach --name "$name" --restart=no --network none "$image" \
            python -c 'from pathlib import Path; import time; Path("/tmp/ready").touch(); time.sleep(30)'
          ready=0
          for _ in {1..20}; do
            if docker exec "$name" python -c 'from pathlib import Path; assert Path("/tmp/ready").is_file()'; then
              ready=1
              break
            fi
            sleep 0.25
          done
          [[ "$ready" == 1 ]]
          docker kill --signal=SIGINT "$name"
          exit_code="$(docker wait "$name")"
          printf 'python_pid1_sigint_exit_code=%s\n' "$exit_code"
          [[ "$exit_code" == 130 ]]
      - name: Contratos de distribuição e cobertura backend
        run: python -m unittest scripts.test_backend_ci -v
      - name: Reutilizar CI verde da main ou validar integralmente esta PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          python -m unittest scripts.test_verify_main_ci_evidence scripts.test_fast_preview_release -q
          if python scripts/verify_main_ci_evidence.py --sha "$CI_BASE_SHA"; then
            echo "ci_reuse_evidence=available"
          else
            echo "::notice::CI verde da base indisponível; os jobs completos desta PR continuam sendo exigidos."
            echo "ci_reuse_evidence=unavailable_full_pr_validation=required"
          fi
      - name: Reconciliação e preservação dos containers históricos 0090
        run: |
          python -m unittest scripts.test_preview_historical_containers -v
          ruff check --select F,E9 scripts/preview_adjustment_migration_*.py scripts/prove_preview_compose_preservation.py
      - name: Provar preservação com Compose 2.35.1 em runner descartável
        shell: bash
        run: |
          set -Eeuo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/preview-compose-proof"
          mkdir -p "$DOCKER_CONFIG/cli-plugins"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/docker/compose/releases/download/v2.35.1/docker-compose-linux-x86_64 \
            -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
          echo "7bdb2ce2916e5dd0354e5d129892bf96fdcdb1a9ab8eed69b9173e131db4c230  $DOCKER_CONFIG/cli-plugins/docker-compose" | sha256sum --check
          chmod 700 "$DOCKER_CONFIG/cli-plugins/docker-compose"
          python scripts/prove_preview_compose_preservation.py
      - name: Compatibilidade dos helpers operacionais com Python do host
        shell: bash
        run: |
          set -Eeuo pipefail
          image='docker.io/library/python:3.8.20-slim-bookworm@sha256:1d52838af602b4b5a831beb13a0e4d073280665ea7be7f69ce2382f29c5a613f'
          docker pull "$image"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$PWD:/workspace:ro" -w /workspace "$image" python -B -m unittest \
            scripts.test_preview_historical_containers scripts.test_preview_adjustment_migration_inventory \
            scripts.test_preview_adjustment_migration_release_flow scripts.test_preview_adjustment_migration_release -q

  backend-tests:
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    services:
      tenant-postgres:
        # Use a origem oficial no Docker Hub para evitar a quota mensal de transferência do ECR Public.
        image: docker.io/library/postgres:17-alpine
        env:
          POSTGRES_DB: pyp_tenant_test
          POSTGRES_USER: pyp_test
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 55469:5432
        options: >-
          --health-cmd "pg_isready -U pyp_test -d pyp_tenant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      photographer-postgres:
        image: docker.io/library/postgres:17-alpine
        env:
          POSTGRES_DB: pyp_photographer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 15470:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pyp_photographer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TENANT_TEST_DATABASE_URL: postgresql+psycopg://pyp_test:synthetic-test-only@127.0.0.1:55469/pyp_tenant_test
      PHOTOGRAPHER_TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-test-only@127.0.0.1:15470/pyp_photographer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/face-requirements.txt
            backend/benchmark-requirements.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt -r backend/face-requirements.txt -r backend/benchmark-requirements.txt
      - name: Suíte completa distribuída por módulos
        run: >-
          python scripts/backend_ci.py run --index ${{ matrix.shard }} --count 3
          --output "$RUNNER_TEMP/backend-reports/shard-${{ matrix.shard }}.json"
      - name: Variante PostgreSQL do inventário de exclusão
        if: ${{ matrix.shard == 0 }}
        run: >-
          DATABASE_URL="$TENANT_TEST_DATABASE_URL"
          pytest backend/tests/test_admin_client_directory.py::test_deletion_removes_combined_homolog_operational_inventory_and_keeps_tombstone -q
      - name: Publicar cobertura e tempos da parte
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-reports/
          if-no-files-found: error
          retention-days: 7

  backend:
    needs: [ci-scope, backend-quality, backend-tests]
    if: ${{ always() && needs.ci-scope.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exigir sucesso da qualidade e de todas as partes
        env:
          SCOPE_RESULT: ${{ needs.ci-scope.result }}
          QUALITY_RESULT: ${{ needs.backend-quality.result }}
          TESTS_RESULT: ${{ needs.backend-tests.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$TESTS_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*
          path: ${{ runner.temp }}/backend-reports/
          merge-multiple: true
      - name: Confirmar coleção completa sem omissões ou sobreposição
        run: python scripts/backend_ci.py verify --count 3 --artifacts "$RUNNER_TEMP/backend-reports"

  frontend:
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
        working-directory: frontend
      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend
      - name: Testes (vitest)
        run: npm test -- --maxWorkers=2
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  runtime-images:
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.backend_image == 'true' || needs.ci-scope.outputs.frontend_image == 'true' || needs.ci-scope.outputs.preview == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Conferir arquitetura nativa do runner
        shell: bash
        run: |
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Arquitetura nativa divergente da matriz de validação"; exit 1 ;;
          esac
      - name: Build isolado do runtime facial AMD64
        if: ${{ matrix.arch == 'amd64' && needs.ci-scope.outputs.backend_image == 'true' }}
        run: docker buildx build --platform linux/amd64 --load --tag face-worker:validation-amd64 --file backend/Dockerfile.face backend
      - name: Build isolado do runtime facial ARM64
        if: ${{ matrix.arch == 'arm64' && needs.ci-scope.outputs.backend_image == 'true' }}
        run: docker buildx build --platform linux/arm64 --load --tag face-worker:validation-arm64 --file backend/Dockerfile.face backend
      - name: Build local da API (sem publicar ou iniciar serviços)
        if: ${{ matrix.arch == 'amd64' && needs.ci-scope.outputs.backend_image == 'true' }}
        run: docker build --tag backend:validation --file backend/Dockerfile backend
      - name: Build local da imagem frontend (sem publicar ou iniciar serviços)
        if: ${{ matrix.arch == 'amd64' && needs.ci-scope.outputs.frontend_image == 'true' }}
        run: docker build --tag frontend:validation --file frontend/Dockerfile frontend
      - name: Frontend ARM64 isolado e versões do lockfile
        if: ${{ matrix.arch == 'arm64' && needs.ci-scope.outputs.frontend_image == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker buildx build --platform linux/arm64 --load --tag frontend:validation-arm64 --file frontend/Dockerfile frontend
          expected="$(python -c 'import json; p=json.load(open("frontend/package-lock.json"))["packages"]; print(json.dumps({n:p["node_modules/"+n]["version"] for n in ("next","react","react-dom")}))')"
          docker run --rm --network none --platform linux/arm64 -e EXPECTED_PACKAGES="$expected" --entrypoint node frontend:validation-arm64 -e '
            const fs=require("fs"), assert=require("assert");
            const actual=Object.fromEntries(["next","react","react-dom"].map(n=>[n,JSON.parse(fs.readFileSync("/app/node_modules/"+n+"/package.json","utf8")).version]));
            assert.deepStrictEqual(actual, JSON.parse(process.env.EXPECTED_PACKAGES)); console.log(actual);'
      - name: Build local de prévias (sem publicar ou iniciar serviços)
        if: ${{ needs.ci-scope.outputs.preview == 'true' }}
        run: docker build --tag preview-adjustment:validation-${{ matrix.arch }} --file backend/Dockerfile.preview-adjustment backend
      - name: Smoke sintético headless RawTherapee 5.13
        if: ${{ needs.ci-scope.outputs.preview == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m --tmpfs /out:rw,noexec,nosuid,size=32m \
            -e PYTHONPATH=/app -v "$GITHUB_WORKSPACE/scripts/preview_adjustment_smoke.py:/tmp/preview_adjustment_smoke.py:ro" \
            "preview-adjustment:validation-${{ matrix.arch }}" python /tmp/preview_adjustment_smoke.py

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar mudanças e specs
        run: |
          set +e
          npx -y @fission-ai/openspec@1.14.0 validate --strict --all
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Diagnóstico detalhado do OpenSpec"
            npx -y @fission-ai/openspec@1.14.0 validate unify-gallery-presentation --type change --strict --no-interactive --json || true
            echo "::endgroup::"
            exit "$status"
          fi

  homolog-inventory-policy:
    needs: [ci-scope, backend, frontend, runtime-images, openspec, gitleaks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exigir sucesso de cada validação necessária
        shell: bash
        env:
          CI_SCOPE_RESULT: ${{ needs.ci-scope.result }}
          BACKEND_REQUIRED: ${{ needs.ci-scope.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_REQUIRED: ${{ needs.ci-scope.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUNTIME_IMAGES_REQUIRED: ${{ needs.ci-scope.outputs.backend_image == 'true' || needs.ci-scope.outputs.frontend_image == 'true' || needs.ci-scope.outputs.preview == 'true' }}
          RUNTIME_IMAGES_RESULT: ${{ needs.runtime-images.result }}
          OPENSPEC_RESULT: ${{ needs.openspec.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: python scripts/check_ci_results.py
      - name: Validar sintaxe Bash do inventário
        run: bash -n scripts/inventory-homolog-readonly.sh
      - name: Testar política de escopo e SHA
        run: python scripts/test_readonly_homolog_inventory_policy.py
      - name: Contrato técnico de candidato e recusa de publicação protegida
        run: python -m unittest discover -s scripts -p test_release_candidate_policy.py
      - name: Contratos de dependências por imagem e isolamento web
        run: python scripts/test_dependency_release.py
      - name: Contratos da atualização Orders e recuperação sem perda financeira
        run: python scripts/test_orders_pilot_release.py
      - name: Regressões do gate restrito facial em homologação
        if: ${{ github.ref != 'refs/heads/main' && github.base_ref != 'main' }}
        run: |
          bash -n scripts/production-preflight-ssh-wrapper.sh
          bash -n scripts/install-prod-preview-migration-wrapper.sh
          bash -n scripts/deploy-prod-preview-adjustment-migration.sh
          bash scripts/test_deploy_prod_facial_services.sh
          python scripts/test_prod_facial_release_gates.py
          python scripts/test_classify_prod_release.py
      - name: Validar política de preflight e aprovação única de produção
        if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: |
          bash -n scripts/production-preflight-ssh-wrapper.sh
          bash -n scripts/install-prod-preview-migration-wrapper.sh
          bash scripts/test_deploy_prod_facial_services.sh
          bash -n scripts/deploy-prod-app-services.sh
          bash scripts/test_deploy_prod_app_services.sh
          python scripts/test_prod_facial_release_gates.py
          python scripts/test_prod_app_release_scope.py
          python scripts/test_prepare_emergency_api_image.py
          python scripts/test_classify_prod_release.py
          python scripts/test_retirement_approval.py
          python -m unittest scripts.test_prod_release_state.ReleaseContracts.test_preview_migration_wrapper_runs_only_pinned_readonly_inventory scripts.test_prod_release_state.ReleaseContracts.test_preview_migration_wrapper_rejects_arbitrary_command -v
          python scripts/test_production_release_workflow_policy.py

  # The protected main branch still requires this legacy context. It reports
  # the current aggregate only; no Gemma runtime or image is built.
  gemma-runtime:
    needs: [homolog-inventory-policy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Satisfazer o contexto legado somente após os gates atuais
        env:
          INVENTORY_POLICY_RESULT: ${{ needs.homolog-inventory-policy.result }}
        run: |
          if [[ "$INVENTORY_POLICY_RESULT" != "success" ]]; then
            echo "O agregado de validações atuais não passou: $INVENTORY_POLICY_RESULT" >&2
            exit 1
          fi
          echo "Gates atuais aprovados; nenhum runtime Gemma é executado."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp gitleaks
      - name: Executar varredura de segredos (histórico completo)
        run: /tmp/gitleaks git -v

  deploy-homolog:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}"
    needs: [backend, frontend, runtime-images, openspec, homolog-inventory-policy, gitleaks]
    runs-on: ubuntu-latest
    environment: homolog
    permissions:
      contents: read
    env:
      HOMOLOG_SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
      HOMOLOG_SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
      HOMOLOG_SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
      HOMOLOG_SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
      HOMOLOG_SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
      HOMOLOG_PUBLIC_BASE_URL: ${{ secrets.HOMOLOG_PUBLIC_BASE_URL }}
      HOMOLOG_FACIAL_MAX_REFERENCE_BYTES: "31457280"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validar automação de entrega
        run: bash scripts/test_deploy_homolog.sh
      - name: Publicar SHA aprovado em homologação
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in HOMOLOG_SSH_HOST HOMOLOG_SSH_PORT HOMOLOG_SSH_USER HOMOLOG_SSH_PRIVATE_KEY HOMOLOG_SSH_KNOWN_HOSTS HOMOLOG_PUBLIC_BASE_URL; do
            if [[ -z "${!required}" ]]; then
              echo "Secret obrigatório ausente: $required" >&2
              exit 1
            fi
          done
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$HOMOLOG_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$HOMOLOG_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          maintenance_mode="inventory"
          maintenance_confirmation=""
          maintenance_without_backup=""
          if git log -1 --pretty=%B | grep -Fxq 'Homolog-Cleanup: galleries-and-clients-without-backup'; then
            maintenance_mode="execute"
            maintenance_confirmation="DELETE_HOMOLOG_GALLERIES_AND_CLIENTS_WITHOUT_BACKUP"
            maintenance_without_backup="--without-backup"
          elif git log -1 --pretty=%B | grep -Fxq 'Homolog-Cleanup: galleries-and-clients'; then
            maintenance_mode="execute"
            maintenance_confirmation="DELETE_HOMOLOG_GALLERIES_AND_CLIENTS"
          fi
          if [[ "$maintenance_without_backup" == "--without-backup" ]]; then
            expected_sha="$(git log -1 --pretty=%B | sed -nE 's/^Homolog-Cleanup-Expected-SHA: ([0-9a-f]{40})$/\1/p')"
            [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'SHA inventariado ausente ou inválido' >&2; exit 1; }
            git merge-base --is-ancestor "$expected_sha" "$GITHUB_SHA"
            if ! git diff --quiet "$expected_sha" "$GITHUB_SHA" -- backend frontend docker scripts ':(exclude)scripts/test_maintain_homolog_policy.py'; then
              echo 'Código operacional mudou desde o SHA inventariado; limpeza cancelada' >&2
              exit 1
            fi
            remote_command="$(printf 'cd /opt/markina-gallery && test "$(git rev-parse HEAD)" = %q && curl -fsS http://127.0.0.1:8080/healthz >/dev/null && curl -fsS http://127.0.0.1:8080/api/health >/dev/null' "$expected_sha")"
