name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      operation:
        description: Operação manual protegida em produção
        type: choice
        required: true
        default: none
        options:
          - none
          - app-release
          - app-rollback

jobs:
  ci-scope:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      gemma: ${{ steps.classify.outputs.gemma }}
      backend_image: ${{ steps.classify.outputs.backend_image }}
      frontend_image: ${{ steps.classify.outputs.frontend_image }}
      preview: ${{ steps.classify.outputs.preview }}
      raw: ${{ steps.classify.outputs.raw }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classificar validações necessárias
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA...$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths.txt"
            python scripts/classify_ci_scope.py --output "$GITHUB_OUTPUT" < "$RUNNER_TEMP/changed-paths.txt"
          else
            python scripts/classify_ci_scope.py --full --output "$GITHUB_OUTPUT"
          fi

  backend:
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      tenant-postgres:
        # Use a origem oficial no Docker Hub para evitar a quota mensal de transferência do ECR Public.
        image: docker.io/library/postgres:17-alpine
        env:
          POSTGRES_DB: pyp_tenant_test
          POSTGRES_USER: pyp_test
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 55469:5432
        options: >-
          --health-cmd "pg_isready -U pyp_test -d pyp_tenant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      photographer-postgres:
        image: docker.io/library/postgres:17-alpine
        env:
          POSTGRES_DB: pyp_photographer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 15470:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pyp_photographer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TENANT_TEST_DATABASE_URL: postgresql+psycopg://pyp_test:synthetic-test-only@127.0.0.1:55469/pyp_tenant_test
      PHOTOGRAPHER_TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-test-only@127.0.0.1:15470/pyp_photographer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt -r backend/face-requirements.txt -r backend/benchmark-requirements.txt
      - name: Lint (ruff)
        run: ruff check backend/app backend/tests
      - name: Persistência de branding e política de deploy
        run: |
          python scripts/test_preserve_branding.py -v
          python -m unittest scripts.test_third_party_report -v
          bash scripts/test_deploy_homolog.sh
          bash scripts/test_deploy_prod_web.sh
          bash -n scripts/deploy-prod-facial-services.sh
          bash scripts/test_reset_homolog_owner.sh
          python scripts/test_owner_reset_policy.py
          python scripts/check_prod_facial_release_gates.py
          ruff check scripts/reset_homolog_owner.py
      - name: Regressão focada da migration de consentimento facial
        run: pytest backend/tests/test_facial_conditional_consent_migration.py -q
      - name: Regressões focadas da referência facial e confirmação de envio
        run: pytest backend/tests/test_facial_provider.py backend/tests/test_facial_search.py -q
      - name: Regressões dos limites faciais por origem
        run: >-
          pytest backend/tests/test_facial_config.py backend/tests/test_facial_search_worker.py
          -q -k 'candidate_policy or reference_possibilities or gemma_query_worker'
      - name: Regressão da chave do aviso privado em PostgreSQL
        run: >-
          pytest backend/tests/test_private_notification_postgres.py
          backend/tests/test_private_upload_batches.py::test_canonical_restricted_folder_upload_notifies_only_after_closed_batch_is_ready -q
      - name: Regressões de autorização dos avisos privados e OTP
        run: >-
          pytest backend/tests/test_private_notification_authorization.py
          backend/tests/test_otp_privacy.py backend/tests/test_invite_only_otp.py
          backend/tests/test_tenant_notification_transport.py -q

      - name: Regressões do login e reenvio OTP
        run: pytest backend/tests/test_auth.py -q -k otp
      - name: Testes (pytest)
        run: pytest backend/tests -q
      - name: Regressões de concorrência multi-tenant em PostgreSQL
        run: |
          export PHOTOGRAPHER_TEST_DATABASE_URL="$PHOTOGRAPHER_TEST_DATABASE_URL"
          pytest \
            backend/tests/test_tenant_cleanup_jobs.py::test_copia_historica_suspensa_antes_publicacao_nao_publica_A \
            backend/tests/test_tenant_media_jobs.py::test_suspensao_durante_render_nao_publica_A_e_worker_avanca_B \
            backend/tests/test_tenant_notification_transport.py::test_suspensao_durante_consulta_canal_preserva_A_e_envia_B \
            backend/tests/test_tenant_notification_transport.py::test_revogacao_membership_apos_consulta_canal_impede_envio \
            -q
      - name: Regressão concorrente do checkout em PostgreSQL
        run: >-
          DATABASE_URL="$PHOTOGRAPHER_TEST_DATABASE_URL"
          pytest backend/tests/test_provider_checkout.py::test_clique_concorrente_com_mesma_chave_produz_uma_reserva -q
      - name: Regressão do inventário de exclusão em PostgreSQL
        run: >-
          DATABASE_URL="$TENANT_TEST_DATABASE_URL"
          pytest backend/tests/test_admin_client_directory.py::test_deletion_removes_combined_homolog_operational_inventory_and_keeps_tombstone -q

  gemma-runtime:
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.gemma == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU AMD64 isolado
        run: |
          docker buildx create --name gemma-validation --driver docker-container \
            --driver-opt memory=2g --driver-opt memory-swap=2g \
            --driver-opt cpu-period=100000 --driver-opt cpu-quota=100000
          docker buildx build --builder gemma-validation --platform linux/amd64 \
            --load --tag gemma-runtime:validation --file backend/Dockerfile.gemma backend
          docker buildx stop gemma-validation
      - name: Inferência sintética offline
        run: |
          docker run --rm --network none --memory 6g --memory-swap 6g --cpus 1 \
            --pids-limit 256 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            -e PYTHONPATH=/app -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 -e MKL_NUM_THREADS=1 \
            -v "$GITHUB_WORKSPACE/scripts/check_gemma_runtime.py:/tmp/check_gemma_runtime.py:ro" \
            gemma-runtime:validation python /tmp/check_gemma_runtime.py

  frontend:
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
        working-directory: frontend
      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend
      - name: Testes (vitest)
        run: npm test -- --maxWorkers=2
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  runtime-images:
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.backend_image == 'true' || needs.ci-scope.outputs.frontend_image == 'true' || needs.ci-scope.outputs.preview == 'true' || needs.ci-scope.outputs.raw == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar emulação ARM64 para builds isolados
        if: ${{ needs.ci-scope.outputs.backend_image == 'true' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build isolado do runtime facial AMD64
        if: ${{ needs.ci-scope.outputs.backend_image == 'true' }}
        run: docker buildx build --platform linux/amd64 --load --tag face-worker:validation-amd64 --file backend/Dockerfile.face backend
      - name: Build isolado do runtime facial ARM64
        if: ${{ needs.ci-scope.outputs.backend_image == 'true' }}
        run: docker buildx build --platform linux/arm64 --load --tag face-worker:validation-arm64 --file backend/Dockerfile.face backend
      - name: Build local da API (sem publicar ou iniciar serviços)
        if: ${{ needs.ci-scope.outputs.backend_image == 'true' }}
        run: docker build --tag backend:validation --file backend/Dockerfile backend
      - name: Build local da imagem frontend (sem publicar ou iniciar serviços)
        if: ${{ needs.ci-scope.outputs.frontend_image == 'true' }}
        run: docker build --tag frontend:validation --file frontend/Dockerfile frontend
      - name: Build local de prévias (sem publicar ou iniciar serviços)
        if: ${{ needs.ci-scope.outputs.preview == 'true' }}
        run: docker build --tag preview-adjustment:validation --file backend/Dockerfile.preview-adjustment backend
      - name: Build local do conversor RAW opt-in (sem publicar ou iniciar serviços)
        if: ${{ needs.ci-scope.outputs.raw == 'true' }}
        run: docker build --tag raw-development:validation --file backend/Dockerfile.raw-development backend

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar mudanças e specs
        run: |
          set +e
          npx -y @fission-ai/openspec@1.14.0 validate --strict --all
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Diagnóstico detalhado do OpenSpec"
            npx -y @fission-ai/openspec@1.14.0 validate unify-gallery-presentation --type change --strict --no-interactive --json || true
            echo "::endgroup::"
            exit "$status"
          fi

  homolog-inventory-policy:
    needs: [ci-scope, backend, frontend, gemma-runtime, runtime-images, openspec, gitleaks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exigir sucesso de cada validação necessária
        shell: bash
        env:
          CI_SCOPE_RESULT: ${{ needs.ci-scope.result }}
          BACKEND_REQUIRED: ${{ needs.ci-scope.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_REQUIRED: ${{ needs.ci-scope.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          GEMMA_REQUIRED: ${{ needs.ci-scope.outputs.gemma }}
          GEMMA_RESULT: ${{ needs.gemma-runtime.result }}
          RUNTIME_IMAGES_REQUIRED: ${{ needs.ci-scope.outputs.backend_image == 'true' || needs.ci-scope.outputs.frontend_image == 'true' || needs.ci-scope.outputs.preview == 'true' || needs.ci-scope.outputs.raw == 'true' }}
          RUNTIME_IMAGES_RESULT: ${{ needs.runtime-images.result }}
          OPENSPEC_RESULT: ${{ needs.openspec.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: python scripts/check_ci_results.py
      - name: Validar sintaxe Bash do inventário
        run: bash -n scripts/inventory-homolog-readonly.sh
      - name: Testar política de escopo e SHA
        run: python scripts/test_readonly_homolog_inventory_policy.py
      - name: Regressões do gate restrito facial em homologação
        if: ${{ github.ref != 'refs/heads/main' && github.base_ref != 'main' }}
        run: |
          bash -n scripts/production-preflight-ssh-wrapper.sh
          bash scripts/test_deploy_prod_facial_services.sh
          python scripts/test_prod_facial_release_gates.py
          python scripts/test_classify_prod_release.py
      - name: Validar política de preflight e aprovação única de produção
        if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: |
          bash -n scripts/production-preflight-ssh-wrapper.sh
          bash scripts/test_deploy_prod_facial_services.sh
          bash -n scripts/deploy-prod-app-services.sh
          bash scripts/test_deploy_prod_app_services.sh
          python scripts/test_prod_facial_release_gates.py
          python scripts/test_prod_app_release_scope.py
          python scripts/test_classify_prod_release.py
          python scripts/test_production_release_workflow_policy.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp gitleaks
      - name: Executar varredura de segredos (histórico completo)
        run: /tmp/gitleaks git -v

  deploy-homolog:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}"
    needs: [backend, frontend, gemma-runtime, runtime-images, openspec, homolog-inventory-policy, gitleaks]
    runs-on: ubuntu-latest
    environment: homolog
    permissions:
      contents: read
    env:
      HOMOLOG_SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
      HOMOLOG_SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
      HOMOLOG_SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
      HOMOLOG_SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
      HOMOLOG_SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
      HOMOLOG_PUBLIC_BASE_URL: ${{ secrets.HOMOLOG_PUBLIC_BASE_URL }}
      HOMOLOG_FACIAL_MAX_REFERENCE_BYTES: "31457280"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validar automação de entrega
        run: bash scripts/test_deploy_homolog.sh
      - name: Publicar SHA aprovado em homologação
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in HOMOLOG_SSH_HOST HOMOLOG_SSH_PORT HOMOLOG_SSH_USER HOMOLOG_SSH_PRIVATE_KEY HOMOLOG_SSH_KNOWN_HOSTS HOMOLOG_PUBLIC_BASE_URL; do
            if [[ -z "${!required}" ]]; then
              echo "Secret obrigatório ausente: $required" >&2
              exit 1
            fi
          done
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$HOMOLOG_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$HOMOLOG_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          maintenance_mode="inventory"
          maintenance_confirmation=""
          maintenance_without_backup=""
          if git log -1 --pretty=%B | grep -Fxq 'Homolog-Cleanup: galleries-and-clients-without-backup'; then
            maintenance_mode="execute"
            maintenance_confirmation="DELETE_HOMOLOG_GALLERIES_AND_CLIENTS_WITHOUT_BACKUP"
            maintenance_without_backup="--without-backup"
          elif git log -1 --pretty=%B | grep -Fxq 'Homolog-Cleanup: galleries-and-clients'; then
            maintenance_mode="execute"
            maintenance_confirmation="DELETE_HOMOLOG_GALLERIES_AND_CLIENTS"
          fi
          if [[ "$maintenance_without_backup" == "--without-backup" ]]; then
            expected_sha="$(git log -1 --pretty=%B | sed -nE 's/^Homolog-Cleanup-Expected-SHA: ([0-9a-f]{40})$/\1/p')"
            [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'SHA inventariado ausente ou inválido' >&2; exit 1; }
            git merge-base --is-ancestor "$expected_sha" "$GITHUB_SHA"
            if ! git diff --quiet "$expected_sha" "$GITHUB_SHA" -- backend frontend docker scripts ':(exclude)scripts/test_maintain_homolog_policy.py'; then
              echo 'Código operacional mudou desde o SHA inventariado; limpeza cancelada' >&2
              exit 1
            fi
            remote_command="$(printf 'cd /opt/markina-gallery && test "$(git rev-parse HEAD)" = %q && curl -fsS http://127.0.0.1:8080/healthz >/dev/null && curl -fsS http://127.0.0.1:8080/api/health >/dev/null' "$expected_sha")"
            ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST" "$remote_command" </dev/null
          else
            remote_command="$(printf 'cd /opt/markina-gallery && env MARKINA_EXPECTED_REPOSITORY=%q MARKINA_PUBLIC_BASE_URL=%q FACIAL_MAX_REFERENCE_BYTES=%q bash -s -- --sha %q' "$GITHUB_REPOSITORY" "$HOMOLOG_PUBLIC_BASE_URL" "$HOMOLOG_FACIAL_MAX_REFERENCE_BYTES" "$GITHUB_SHA")"
            ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST" "$remote_command" < scripts/deploy-homolog.sh
          fi
          maintenance_command="$(printf 'cd /opt/markina-gallery && bash -s -- --mode %q --confirmation %q' "$maintenance_mode" "$maintenance_confirmation")"
          if [[ -n "$maintenance_without_backup" ]]; then
            maintenance_command+=" --without-backup"
          fi
          ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST" "$maintenance_command" < scripts/maintain-homolog-data.sh

  release-scope:
    if: "${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'app-release')) }}"
    needs: [backend, frontend, gemma-runtime, openspec, homolog-inventory-policy, gitleaks]
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.release_scope }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classificar delta desde o SHA saudável registrado
        id: classify
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            event_base_sha='${{ github.event.before }}'
          else
            event_base_sha="$(git rev-parse "$GITHUB_SHA^")"
          fi
          python scripts/classify_prod_release.py --base "$event_base_sha" --target "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  production-preflight:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-scope.outputs.scope == 'facial' }}"
    needs: [backend, frontend, gemma-runtime, openspec, homolog-inventory-policy, gitleaks, release-scope]
    runs-on: ubuntu-latest
    environment: production-preflight
    permissions:
      contents: read
    outputs:
      release_ready: ${{ steps.gates.outputs.release_ready }}
      approval_fingerprint: ${{ steps.inventory.outputs.approval_fingerprint }}
    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_PREFLIGHT_SSH_HOST }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_PREFLIGHT_SSH_PORT }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_PREFLIGHT_SSH_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_PREFLIGHT_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_PREFLIGHT_SSH_KNOWN_HOSTS }}
      PRODUCTION_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PREFLIGHT_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verificar configuração protegida
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_KNOWN_HOSTS PRODUCTION_PUBLIC_BASE_URL; do
            [[ -n "${!required}" ]] || { echo "Configuração protegida ausente: $required" >&2; exit 1; }
          done
          [[ "$PRODUCTION_PUBLIC_BASE_URL" == "https://markina.pickyourpic.com.br" ]] || { echo 'Domínio diverge do inventário aprovado' >&2; exit 1; }
          [[ "$PRODUCTION_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Porta SSH inválida' >&2; exit 1; }
          if ! git diff --quiet "$GITHUB_SHA^" "$GITHUB_SHA" -- docker/; then
            echo 'A mudança inclui Compose/Docker e exige plano separado' >&2
            exit 1
          fi
          migration_paths="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- backend/migrations/)"
          if [[ -n "$migration_paths" && "$migration_paths" != 'backend/migrations/versions/20261016_0082_facial_conditional_consent.py' ]]; then
            echo 'A mudança inclui migration fora do escopo aprovado' >&2
            exit 1
          fi
      - name: Inventário remoto somente leitura
        id: inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          output_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file" "$output_file"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh -i "$key_file" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "MARKINA_TARGET_SHA=$GITHUB_SHA" </dev/null | tee "$output_file" | tee -a "$GITHUB_STEP_SUMMARY"
          fingerprint="$(sed -nE 's/^approval_fingerprint=([0-9a-f]{64})$/\1/p' "$output_file" | tail -n1)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || { echo 'Inventário não forneceu fingerprint válido' >&2; exit 1; }
          echo "approval_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Avaliar manutenção autorizada sem primeira ativação
        id: gates
        run: python scripts/check_prod_facial_release_gates.py --maintenance | tee -a "$GITHUB_STEP_SUMMARY"

  production-release:
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-scope.outputs.scope == 'facial' && needs.production-preflight.outputs.release_ready == 'true' }}"
    needs: [backend, frontend, gemma-runtime, openspec, homolog-inventory-policy, gitleaks, release-scope, production-preflight]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publicar somente os serviços aprovados
        shell: bash
        env:
          APPROVAL_FINGERPRINT: ${{ needs.production-preflight.outputs.approval_fingerprint }}
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh -i "$key_file" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "cd /opt/markina-gallery && MARKINA_EXPECTED_REPOSITORY='$GITHUB_REPOSITORY' MARKINA_PUBLIC_BASE_URL='$PRODUCTION_PUBLIC_BASE_URL' bash -s -- --mode release --sha '$GITHUB_SHA' --approval-fingerprint '$APPROVAL_FINGERPRINT'" \
            < scripts/deploy-prod-facial-services.sh

  production-app-preflight:
    if: "${{ github.ref == 'refs/heads/main' && needs.release-scope.outputs.scope == 'app' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'app-release')) }}"
    needs: [backend, frontend, gemma-runtime, openspec, homolog-inventory-policy, gitleaks, release-scope]
    runs-on: ubuntu-latest
    environment: production-preflight
    permissions:
      contents: read
    outputs:
      release_ready: ${{ steps.gates.outputs.release_ready }}
      approval_fingerprint: ${{ steps.inventory.outputs.approval_fingerprint }}
    env:
