      PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_PREFLIGHT_SSH_KNOWN_HOSTS }}
      PRODUCTION_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PREFLIGHT_PUBLIC_BASE_URL }}
      APP_SCOPE_BASE_SHA: ${{ needs.release-scope.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validar escopo e blobs revisados
        id: gates
        run: |
          set -Eeuo pipefail
          python scripts/check_prod_app_release_scope.py --base "$APP_SCOPE_BASE_SHA" --target "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'release_ready=true' >> "$GITHUB_OUTPUT"
      - name: Inventário remoto API/web somente leitura
        id: inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in PRODUCTION_SSH_HOST PRODUCTION_SSH_PORT PRODUCTION_SSH_USER PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_KNOWN_HOSTS PRODUCTION_PUBLIC_BASE_URL; do
            [[ -n "${!required}" ]] || { echo "Configuração protegida ausente: $required" >&2; exit 1; }
          done
          [[ "$PRODUCTION_PUBLIC_BASE_URL" == "https://markina.pickyourpic.com.br" ]] || { echo 'Domínio diverge do alvo' >&2; exit 1; }
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          output_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file" "$output_file"' EXIT
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh -i "$key_file" -p "$PRODUCTION_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "MARKINA_APP_TARGET_SHA=$GITHUB_SHA" </dev/null | tee "$output_file" | tee -a "$GITHUB_STEP_SUMMARY"
          fingerprint="$(sed -nE 's/^approval_fingerprint=([0-9a-f]{64})$/\1/p' "$output_file" | tail -n1)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || { echo 'Fingerprint inválido' >&2; exit 1; }
          echo "approval_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

  production-app-release:
    if: "${{ github.ref == 'refs/heads/main' && needs.release-scope.outputs.scope == 'app' && needs.production-app-preflight.outputs.release_ready == 'true' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'app-release')) }}"
    needs: [backend, frontend, gemma-runtime, openspec, homolog-inventory-policy, gitleaks, release-scope, production-app-preflight]
