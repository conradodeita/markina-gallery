name: Operação facial privada em homologação

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operação autorizada
        required: true
        type: choice
        options: [inventory, activate-private, reconcile-private, monitor, close-private]
      sha:
        description: SHA completo já publicado em homologação
        required: true
        type: string
      batch_id:
        description: Referência opaca do lote (sem PII)
        required: true
        type: string
      origin_ref:
        description: Referência opaca do registro de origem (sem PII)
        required: false
        type: string
      authorization_ref:
        description: Referência opaca da autorização (sem PII)
        required: true
        type: string
      operator_ref:
        description: Referência opaca do admin/fotógrafo (sem PII)
        required: false
        type: string
      expected_count:
        description: Quantidade autorizada, entre 500 e 1000
        required: true
        type: number
      retention_hours:
        description: Retenção máxima, entre 1 e 72 horas
        required: false
        default: 24
        type: number
      window_minutes:
        description: Janela ativa, entre 30 e 240 minutos
        required: false
        default: 120
        type: number
      contains_minors:
        description: O lote autorizado contém menores?
        required: true
        type: boolean
      confirmation:
        description: Token explícito correspondente à operação
        required: true
        type: string

permissions:
  contents: read

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: homolog
    env:
      MODE: ${{ inputs.mode }}
      EXPECTED_SHA: ${{ inputs.sha }}
      BATCH_ID: ${{ inputs.batch_id }}
      ORIGIN_REF: ${{ inputs.origin_ref }}
      AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
      OPERATOR_REF: ${{ inputs.operator_ref }}
      EXPECTED_COUNT: ${{ inputs.expected_count }}
      RETENTION_HOURS: ${{ inputs.retention_hours }}
      WINDOW_MINUTES: ${{ inputs.window_minutes }}
      CONTAINS_MINORS: ${{ inputs.contains_minors }}
      CONFIRMATION: ${{ inputs.confirmation }}
      HOMOLOG_SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
      HOMOLOG_SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
      HOMOLOG_SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
      HOMOLOG_SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
      HOMOLOG_SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Validar contrato operacional local
        run: |
          bash scripts/test_manage_homolog_facial.sh
          python scripts/test_manage_homolog_facial_policy.py
          python scripts/test_benchmark_homolog_facial_policy.py

      - name: Executar operação no host privado
        shell: bash
        run: |
          set -Eeuo pipefail
          for required in HOMOLOG_SSH_HOST HOMOLOG_SSH_PORT HOMOLOG_SSH_USER HOMOLOG_SSH_PRIVATE_KEY HOMOLOG_SSH_KNOWN_HOSTS; do
            [[ -n "${!required}" ]] || { echo "Secret obrigatório ausente: $required" >&2; exit 1; }
          done
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA inválido" >&2; exit 1; }
          [[ "$BATCH_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] || { echo "batch_id inválido" >&2; exit 1; }
          [[ "$AUTHORIZATION_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] || { echo "authorization_ref inválido" >&2; exit 1; }
          (( EXPECTED_COUNT >= 500 && EXPECTED_COUNT <= 1000 )) || { echo "expected_count inválido" >&2; exit 1; }
          case "$MODE" in
            activate-private)
              expected_confirmation="ENABLE_AUTHORIZED_PRIVATE_FACIAL_HOMOLOG"
              [[ "$ORIGIN_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] || { echo "origin_ref inválido" >&2; exit 1; }
              [[ "$OPERATOR_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$ ]] || { echo "operator_ref inválido" >&2; exit 1; }
              (( RETENTION_HOURS >= 1 && RETENTION_HOURS <= 72 )) || { echo "retention_hours inválido" >&2; exit 1; }
              (( WINDOW_MINUTES >= 30 && WINDOW_MINUTES <= 240 )) || { echo "window_minutes inválido" >&2; exit 1; }
              ;;
            reconcile-private) expected_confirmation="RECONCILE_AUTHORIZED_PRIVATE_FACIAL_HOMOLOG" ;;
            monitor) expected_confirmation="BENCHMARK_AUTHORIZED_PRIVATE_FACIAL_HOMOLOG" ;;
            close-private) expected_confirmation="CLOSE_AUTHORIZED_PRIVATE_FACIAL_HOMOLOG" ;;
            inventory) expected_confirmation="INVENTORY_AUTHORIZED_PRIVATE_FACIAL_HOMOLOG" ;;
            *) echo "modo inválido" >&2; exit 1 ;;
          esac
          [[ "$CONFIRMATION" == "$expected_confirmation" ]] || { echo "confirmação explícita inválida" >&2; exit 1; }

          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$HOMOLOG_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$HOMOLOG_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          ssh_base=(ssh -i "$key_file" -p "$HOMOLOG_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" "$HOMOLOG_SSH_USER@$HOMOLOG_SSH_HOST")

          if [[ "$MODE" == "monitor" ]]; then
            remote_command="$(printf 'cd /opt/markina-gallery && python3 - --mode monitor --sha %q --batch-id %q --authorization-ref %q --expected-count %q --contains-minors %q --confirmation %q' "$EXPECTED_SHA" "$BATCH_ID" "$AUTHORIZATION_REF" "$EXPECTED_COUNT" "$CONTAINS_MINORS" "$CONFIRMATION")"
            "${ssh_base[@]}" "$remote_command" < scripts/benchmark-homolog-facial.py | tee facial-benchmark.jsonl
          else
            remote_command="$(printf 'cd /opt/markina-gallery && env MARKINA_EXPECTED_REPOSITORY=%q bash -s -- --mode %q --sha %q --batch-id %q --origin-ref %q --authorization-ref %q --operator-ref %q --expected-count %q --retention-hours %q --window-minutes %q --contains-minors %q --confirmation %q' "$GITHUB_REPOSITORY" "$MODE" "$EXPECTED_SHA" "$BATCH_ID" "$ORIGIN_REF" "$AUTHORIZATION_REF" "$OPERATOR_REF" "$EXPECTED_COUNT" "$RETENTION_HOURS" "$WINDOW_MINUTES" "$CONTAINS_MINORS" "$CONFIRMATION")"
            "${ssh_base[@]}" "$remote_command" < scripts/manage-homolog-facial.sh
          fi

      - name: Preservar somente métricas agregadas
        if: inputs.mode == 'monitor'
        uses: actions/upload-artifact@v4
        with:
          name: facial-benchmark-${{ inputs.batch_id }}-${{ inputs.sha }}
          path: facial-benchmark.jsonl
          if-no-files-found: error
          retention-days: 7
