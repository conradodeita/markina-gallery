name: Instalar canal protegido do backup global

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inventariar, instalar ou restaurar o forced command revisado
        required: true
        type: choice
        options: [inventory, install-wrapper, restore-wrapper]
      restore_backup_sha256:
        description: SHA-256 da cópia root-only indicado no resumo aprovado da instalação anterior; obrigatório somente em restore-wrapper
        required: false
        type: string
        default: ''
      approval_fingerprint:
        description: Fingerprint do preflight read-only revisado (vazio somente em inventory)
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: production-platform-backup-wrapper
  cancel-in-progress: false

jobs:
  code-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Conferir CI verde do SHA exato da main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_main_ci_evidence.py --sha "$GITHUB_SHA"

  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [code-evidence]
    runs-on: ubuntu-latest
    environment: production-preflight
    permissions:
      contents: read
    outputs:
      fingerprint: ${{ steps.inventory.outputs.fingerprint }}
      connection_binding: ${{ steps.inventory.outputs.connection_binding }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventariar app e host com o forced command atual
        id: inventory
        shell: bash
        env:
          SSH_HOST: ${{ vars.PRODUCTION_PREFLIGHT_SSH_HOST }}
          SSH_PORT: ${{ vars.PRODUCTION_PREFLIGHT_SSH_PORT }}
          SSH_USER: ${{ vars.PRODUCTION_PREFLIGHT_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_PREFLIGHT_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_PREFLIGHT_SSH_KNOWN_HOSTS }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "Configuração protegida ausente: $name" >&2; exit 1; }
          done
          key_file="$(mktemp)"; known_file="$(mktemp)"; output="$(mktemp)"
          trap 'rm -f "$key_file" "$known_file" "$output"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_file"
          chmod 600 "$key_file" "$known_file"
          target="$SSH_USER@$SSH_HOST"
          options=(-i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_file")
          ssh "${options[@]}" "$target" "MARKINA_APP_TARGET_SHA=$GITHUB_SHA" </dev/null | tee "$output" | tee -a "$GITHUB_STEP_SUMMARY"
          fingerprint="$(sed -nE 's/^approval_fingerprint=([0-9a-f]{64})$/\1/p' "$output" | tail -n1)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          binding="$(printf '%s' "$SSH_HOST|$SSH_PORT|$SSH_USER" | sha256sum | awk '{print $1}')"
          echo "connection_binding=$binding" >> "$GITHUB_OUTPUT"

  install-wrapper:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'install-wrapper' }}
    needs: [code-evidence, preflight]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Revalidar CI, fingerprint e destino do canal de escrita
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_FINGERPRINT: ${{ inputs.approval_fingerprint }}
          INVENTORY_FINGERPRINT: ${{ needs.preflight.outputs.fingerprint }}
          INVENTORY_CONNECTION: ${{ needs.preflight.outputs.connection_binding }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_main_ci_evidence.py --sha "$GITHUB_SHA"
          [[ "$REQUESTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ && "$REQUESTED_FINGERPRINT" == "$INVENTORY_FINGERPRINT" ]]
          production_binding="$(printf '%s' "$SSH_HOST|$SSH_PORT|$SSH_USER" | sha256sum | awk '{print $1}')"
          [[ "$production_binding" == "$INVENTORY_CONNECTION" ]]
      - name: Atualizar somente o forced command após aprovação protegida
        shell: bash
        env:
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          APPROVAL_FINGERPRINT: ${{ inputs.approval_fingerprint }}
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"; known_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_file"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_file"
          chmod 600 "$key_file" "$known_file"
          wrapper_blob="$(git rev-parse "$GITHUB_SHA:scripts/production-preflight-ssh-wrapper.sh")"
          [[ "$wrapper_blob" =~ ^[0-9a-f]{40}$ ]]
          target="$SSH_USER@$SSH_HOST"
          options=(-i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_file")
          ssh "${options[@]}" "$target" \
            "cd /opt/markina-gallery && MARKINA_EXPECTED_REPOSITORY='$GITHUB_REPOSITORY' bash -s -- --sha '$GITHUB_SHA' --wrapper-blob '$wrapper_blob' --approval-fingerprint '$APPROVAL_FINGERPRINT'" \
            < scripts/install-prod-platform-backup-wrapper.sh | tee -a "$GITHUB_STEP_SUMMARY"

  restore-wrapper:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'restore-wrapper' }}
    needs: [code-evidence, preflight]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Revalidar CI, fingerprint, recibo e destino do canal protegido
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_FINGERPRINT: ${{ inputs.approval_fingerprint }}
          INVENTORY_FINGERPRINT: ${{ needs.preflight.outputs.fingerprint }}
          INVENTORY_CONNECTION: ${{ needs.preflight.outputs.connection_binding }}
          RESTORE_BACKUP_SHA256: ${{ inputs.restore_backup_sha256 }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_main_ci_evidence.py --sha "$GITHUB_SHA"
          [[ "$REQUESTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ && "$REQUESTED_FINGERPRINT" == "$INVENTORY_FINGERPRINT" ]]
          [[ "$RESTORE_BACKUP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          production_binding="$(printf '%s' "$SSH_HOST|$SSH_PORT|$SSH_USER" | sha256sum | awk '{print $1}')"
          [[ "$production_binding" == "$INVENTORY_CONNECTION" ]]
      - name: Restaurar somente o forced command após aprovação protegida
        shell: bash
        env:
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          APPROVAL_FINGERPRINT: ${{ inputs.approval_fingerprint }}
          RESTORE_BACKUP_SHA256: ${{ inputs.restore_backup_sha256 }}
        run: |
          set -Eeuo pipefail
          key_file="$(mktemp)"; known_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_file"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_file"
          chmod 600 "$key_file" "$known_file"
          target="$SSH_USER@$SSH_HOST"
          options=(-i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_file")
          remote_command="MARKINA_PLATFORM_BACKUP_RESTORE_WRAPPER_SHA=$GITHUB_SHA"_RECEIPT="$RESTORE_BACKUP_SHA256"_FINGERPRINT="$APPROVAL_FINGERPRINT"
          ssh "${options[@]}" "$target" "$remote_command" </dev/null | tee -a "$GITHUB_STEP_SUMMARY"
