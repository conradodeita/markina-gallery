# Markina Gallery — fundação (scaffolding)
#
# Projeto Compose exclusivo: markina-gallery (use sempre -p markina-gallery -f docker/docker-compose.yml).
# Única porta publicada no host: nginx em ${MARKINA_GALLERY_PORT:-8080}.
# db e redis NUNCA publicam portas; apenas a rede interna markina-gallery_internal.
# Volumes: dados, Redis e mídia são exclusivos do projeto markina-gallery.
#
# Uso local:
#   1) cp .env.example docker/.env   (ajuste valores locais; nunca versionar)
#   2) docker compose -p markina-gallery -f docker/docker-compose.yml up -d --build
#   3) curl http://localhost:8080/healthz
name: markina-gallery

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${MARKINA_GALLERY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      internal: {}
      npm:
        aliases:
          - markina-homolog-nginx

  web:
    build: ../frontend
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  api:
    build: ../backend
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://markina_gallery:markina_gallery_dev_local@db:5432/markina_gallery}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-markina_session}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-5}
      AUTH_PII_FINGERPRINT_SALT: ${AUTH_PII_FINGERPRINT_SALT:-}
      GALLERY_CAPABILITY_SIGNING_KEY: ${GALLERY_CAPABILITY_SIGNING_KEY:-}
      AUTH_OTP_PII_RETENTION_MINUTES: ${AUTH_OTP_PII_RETENTION_MINUTES:-60}
      COMMERCIAL_HISTORY_MEDIA_RETENTION_DAYS: ${COMMERCIAL_HISTORY_MEDIA_RETENTION_DAYS:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-sandbox}
      WHATSAPP_CREDENTIAL_ENV: ${WHATSAPP_CREDENTIAL_ENV:-development}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_OTP_ENCRYPTION_KEY: ${WHATSAPP_OTP_ENCRYPTION_KEY:-}
      WHATSAPP_PHOTOGRAPHER_PHONE_E164: ${WHATSAPP_PHOTOGRAPHER_PHONE_E164:-}
      WHATSAPP_MAX_ATTEMPTS: ${WHATSAPP_MAX_ATTEMPTS:-3}
      WHATSAPP_TIMEOUT_SECONDS: ${WHATSAPP_TIMEOUT_SECONDS:-10}
      WHATSAPP_AMBIGUOUS_RETRY_AFTER_SECONDS: ${WHATSAPP_AMBIGUOUS_RETRY_AFTER_SECONDS:-300}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-sandbox}
      EMAIL_CREDENTIAL_ENV: ${EMAIL_CREDENTIAL_ENV:-development}
      EMAIL_PAYLOAD_ENCRYPTION_KEY: ${EMAIL_PAYLOAD_ENCRYPTION_KEY:-}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      SMTP_IMPLICIT_TLS: ${SMTP_IMPLICIT_TLS:-false}
      MEDIA_SOURCE_ROOT: /var/lib/markina/source
      MEDIA_DERIVATIVES_ROOT: /var/lib/markina/derivatives
      MEDIA_HISTORY_ROOT: /var/lib/markina/history
      MEDIA_WATERMARK_TEXT: ${MEDIA_WATERMARK_TEXT:-MARKINA • PRÉVIA}
    volumes:
      - media-source:/var/lib/markina/source
      - media-derivatives:/var/lib/markina/derivatives
      - media-history:/var/lib/markina/history
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://markina_gallery:markina_gallery_dev_local@db:5432/markina_gallery}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  seed-admin:
    build: ../backend
    command: ["python", "-m", "app.seed_admin"]
    profiles: ["bootstrap"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://markina_gallery:markina_gallery_dev_local@db:5432/markina_gallery}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_TOTP_SECRET: ${ADMIN_SEED_TOTP_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - internal

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-markina_gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markina_gallery_dev_local}
      POSTGRES_DB: ${POSTGRES_DB:-markina_gallery}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-markina_gallery} -d ${POSTGRES_DB:-markina_gallery}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  evolution-api:
    profiles: ["whatsapp-real"]
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_NAME: markina-evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution-api:8080
      DEL_INSTANCE: "false"
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY:-}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER:-markina_evolution}:${EVOLUTION_POSTGRES_PASSWORD:-}@evolution-db:5432/${EVOLUTION_POSTGRES_DB:-markina_evolution}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: markina_gallery_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_DELETE_MESSAGE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: markina_evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "false"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN
      LOG_COLOR: "false"
      QRCODE_LIMIT: 10
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 768m
    cpus: 0.75
    networks:
      - internal

  evolution-db:
    profiles: ["whatsapp-real"]
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-markina_evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-markina_evolution}
    command: ["postgres", "-c", "max_connections=100", "-c", "listen_addresses=*"]
    volumes:
      - evolution-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_POSTGRES_USER:-markina_evolution} -d ${EVOLUTION_POSTGRES_DB:-markina_evolution}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.50
    networks:
      - internal

  evolution-redis:
    profiles: ["whatsapp-real"]
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - evolution-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    cpus: 0.25
    networks:
      - internal

  worker:
    build: ../backend
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://markina_gallery:markina_gallery_dev_local@db:5432/markina_gallery}
      AUTH_PII_FINGERPRINT_SALT: ${AUTH_PII_FINGERPRINT_SALT:-}
      AUTH_OTP_PII_RETENTION_MINUTES: ${AUTH_OTP_PII_RETENTION_MINUTES:-60}
      AUTH_OTP_CLEANUP_INTERVAL_SECONDS: ${AUTH_OTP_CLEANUP_INTERVAL_SECONDS:-60}
      COMMERCIAL_HISTORY_MEDIA_RETENTION_DAYS: ${COMMERCIAL_HISTORY_MEDIA_RETENTION_DAYS:-}
      MEDIA_SOURCE_ROOT: /var/lib/markina/source
      MEDIA_DERIVATIVES_ROOT: /var/lib/markina/derivatives
      MEDIA_HISTORY_ROOT: /var/lib/markina/history
      MEDIA_WATERMARK_TEXT: ${MEDIA_WATERMARK_TEXT:-MARKINA • PRÉVIA}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-sandbox}
      WHATSAPP_CREDENTIAL_ENV: ${WHATSAPP_CREDENTIAL_ENV:-development}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_INSTANCE: ${WHATSAPP_INSTANCE:-}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_OTP_ENCRYPTION_KEY: ${WHATSAPP_OTP_ENCRYPTION_KEY:-}
      WHATSAPP_PHOTOGRAPHER_PHONE_E164: ${WHATSAPP_PHOTOGRAPHER_PHONE_E164:-}
      WHATSAPP_MAX_ATTEMPTS: ${WHATSAPP_MAX_ATTEMPTS:-3}
      WHATSAPP_TIMEOUT_SECONDS: ${WHATSAPP_TIMEOUT_SECONDS:-10}
      WHATSAPP_AMBIGUOUS_RETRY_AFTER_SECONDS: ${WHATSAPP_AMBIGUOUS_RETRY_AFTER_SECONDS:-300}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-sandbox}
      EMAIL_CREDENTIAL_ENV: ${EMAIL_CREDENTIAL_ENV:-development}
      EMAIL_PAYLOAD_ENCRYPTION_KEY: ${EMAIL_PAYLOAD_ENCRYPTION_KEY:-}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      SMTP_IMPLICIT_TLS: ${SMTP_IMPLICIT_TLS:-false}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-3}
      EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-2}
      EMAIL_PROCESSING_TIMEOUT_SECONDS: ${EMAIL_PROCESSING_TIMEOUT_SECONDS:-120}
      ADMIN_SECURITY_CLEANUP_INTERVAL_SECONDS: ${ADMIN_SECURITY_CLEANUP_INTERVAL_SECONDS:-60}
    volumes:
      - media-source:/var/lib/markina/source
      - media-derivatives:/var/lib/markina/derivatives
      - media-history:/var/lib/markina/history
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"app.worker\" >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  media-source:
  media-derivatives:
  media-history:
  evolution-instances:
  evolution-pgdata:
  evolution-redisdata:

networks:
  internal:
    driver: bridge
  npm:
    name: npm-network
    external: true
