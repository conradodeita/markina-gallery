# Markina Gallery — fundação (scaffolding)
#
# Projeto Compose exclusivo: markina-gallery (use sempre -p markina-gallery -f docker/docker-compose.yml).
# Única porta publicada no host: nginx em ${MARKINA_GALLERY_PORT:-8080}.
# db e redis NUNCA publicam portas; apenas a rede interna markina-gallery_internal.
# Volumes: markina-gallery_pgdata e markina-gallery_redisdata.
#
# Uso local:
#   1) cp .env.example docker/.env   (ajuste valores locais; nunca versionar)
#   2) docker compose -p markina-gallery -f docker/docker-compose.yml up -d --build
#   3) curl http://localhost:8080/healthz
name: markina-gallery

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${MARKINA_GALLERY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      internal: {}
      npm:
        aliases:
          - markina-homolog-nginx

  web:
    build: ../frontend
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  api:
    build: ../backend
    expose:
      - "8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://markina_gallery:markina_gallery_dev_local@db:5432/markina_gallery}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-markina_session}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://markina_gallery:markina_gallery_dev_local@db:5432/markina_gallery}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  seed-admin:
    build: ../backend
    command: ["python", "-m", "app.seed_admin"]
    profiles: ["bootstrap"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://markina_gallery:markina_gallery_dev_local@db:5432/markina_gallery}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      ADMIN_SEED_TOTP_SECRET: ${ADMIN_SEED_TOTP_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - internal

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-markina_gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markina_gallery_dev_local}
      POSTGRES_DB: ${POSTGRES_DB:-markina_gallery}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-markina_gallery} -d ${POSTGRES_DB:-markina_gallery}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  worker:
    build: ../backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://markina_gallery:markina_gallery_dev_local@db:5432/markina_gallery}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"app.worker\" >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    driver: bridge
  npm:
    name: npm-network
    external: true
