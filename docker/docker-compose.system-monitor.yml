# Overlay de código, inativo por padrão. Não provisiona nem publica serviço.
# Combinar com compose base e docker-compose.preview-adjustment.yml.
x-monitor: &monitor
  SYSTEM_MONITOR_ENABLED: ${SYSTEM_MONITOR_ENABLED:-false}
  SYSTEM_MONITOR_RETENTION_DAYS: ${SYSTEM_MONITOR_RETENTION_DAYS:-7}
  SYSTEM_MONITOR_ACTIVE_SECONDS: ${SYSTEM_MONITOR_ACTIVE_SECONDS:-120}
  SYSTEM_MONITOR_RECENT_SECONDS: ${SYSTEM_MONITOR_RECENT_SECONDS:-1800}
  SYSTEM_MONITOR_STALE_SECONDS: ${SYSTEM_MONITOR_STALE_SECONDS:-180}
  SYSTEM_MONITOR_ALERT_SECONDS: ${SYSTEM_MONITOR_ALERT_SECONDS:-120}
  SYSTEM_MONITOR_ERROR_PERCENT: ${SYSTEM_MONITOR_ERROR_PERCENT:-5}
  SYSTEM_MONITOR_LATENCY_MS: ${SYSTEM_MONITOR_LATENCY_MS:-2000}
  SYSTEM_MONITOR_QUEUE_AGE_SECONDS: ${SYSTEM_MONITOR_QUEUE_AGE_SECONDS:-300}
  SYSTEM_MONITOR_POOL_PERCENT: ${SYSTEM_MONITOR_POOL_PERCENT:-90}
  SYSTEM_MONITOR_DISK_FREE_PERCENT: ${SYSTEM_MONITOR_DISK_FREE_PERCENT:-10}
  SYSTEM_MONITOR_FAILURE_COUNT: ${SYSTEM_MONITOR_FAILURE_COUNT:-3}
  SYSTEM_MONITOR_CPU_PERCENT: ${SYSTEM_MONITOR_CPU_PERCENT:-90}
  SYSTEM_MONITOR_MEMORY_FREE_PERCENT: ${SYSTEM_MONITOR_MEMORY_FREE_PERCENT:-10}
services:
  api:
    environment:
      <<: *monitor
      APP_VERSION: ${APP_VERSION:-}
      SYSTEM_MONITOR_HOST_SNAPSHOT: ${SYSTEM_MONITOR_HOST_SNAPSHOT:-}
  worker:
    environment: *monitor
  face-search-worker:
    environment: *monitor
  face-index-worker:
    environment: *monitor
  face-maintenance-worker:
    environment: *monitor
  preview-adjustment-worker:
    environment: *monitor
