# Markina Gallery — proxy de entrada único (scaffolding)
# /healthz  -> healthcheck do próprio Nginx (sem dependência de backends)
# /api/...  -> FastAPI (prefixo /api é removido no repasse)
# /         -> Next.js

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Deve corresponder ao limite validado pela API para JPEGs de origem.
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Webhooks do provedor circulam apenas na rede Compose (evolution-api -> api).
    # O proxy público não encaminha nenhuma rota interna, mesmo autenticada.
    location ^~ /api/internal/ {
        access_log off;
        return 404;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rotas autenticadas dependem da sessão e não podem ficar um ano em cache.
    location ~ ^/(admin|library|gallery)(/|$) {
        set $markina_web http://web:3000;
        proxy_pass $markina_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        set $markina_web http://web:3000;
        proxy_pass $markina_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
